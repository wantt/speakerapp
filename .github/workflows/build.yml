name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-22.04
            name: linux-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PyTorch (CPU builds)
        if: runner.os != 'macOS'
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Fetch model checkpoint
        run: python scripts/download_model.py

      - name: Generate icons
        run: python scripts/make_icons.py

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: packaging/macos/build_dmg.sh

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          packaging/windows/build.ps1

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libfuse2 libgl1 libegl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-shape0 libxcb-xkb1
          chmod +x packaging/linux/build_packages.sh scripts/*.py
          packaging/linux/build_packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: voiceprint-studio-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.AppImage