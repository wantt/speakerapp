[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceprint-studio"
version = "1.0.0"
description = "跨平台声纹工作台：声纹注册、比对、1:N 检索与波形展示（ERes2NetV2）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Voiceprint Studio" }]
keywords = ["speaker-verification", "voiceprint", "eres2netv2", "pyside6"]
dependencies = [
    "numpy>=1.26,<3",
    "torch>=2.2,<3",
    "torchaudio>=2.2,<3",
    "soundfile>=0.12",
    "sounddevice>=0.4.6",
    "imageio-ffmpeg>=0.5",
    "PySide6-Essentials>=6.6,<7",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.6", "pillow>=10"]

[project.scripts]
voiceprint-studio = "voiceprint_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voiceprint_studio = ["resources/*"]